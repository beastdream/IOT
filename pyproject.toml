[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-helmet"
version = "0.1.0"
description = "Image helmet-status detection project foundation"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
