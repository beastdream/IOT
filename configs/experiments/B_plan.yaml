additional_constants: Preserve exact baseline args, optimizer resolution, pretrained
  initialization, augmentations, split, epoch length, evaluator and thresholds; only
  sampler changes.
experiment_rationale: '30/50 misses have one-to-one low-confidence same-class candidates;
  18/50 have wrong-class matches. TRAIN objects: With Helmet 2009, Without Helmet
  1038. Image-presence weight 1.5733333333333333 balances the two strata; this tests
  exposure, not a proven cause.'
expected_observation: Fewer Without Helmet misses at the unchanged operating point,
  improved framework recall and mAP50; improvement is not guaranteed.
success_criteria:
- Compare framework Without Helmet recall against 0.5304 using identical evaluation
  settings; also report fixed-confidence 0.25 metrics separately.
- Require recall improvement with a positive lower bound of a paired 95% image-bootstrap
  difference interval; resample whole images to preserve object dependence. This conventional
  uncertainty criterion avoids a fabricated effect-size cutoff.
- 'Conservative precision safeguard: Without Helmet precision must not fall below
  baseline 0.7344789657; overall mAP50 must not fall below 0.7547054629. Report paired
  uncertainty; inconclusive evidence is not a PASS.'
- Report Without Helmet mAP50, overall recall, FP/FN counts, per-size and per-scene
  results; do not select a threshold to manufacture training gains.
- Treat one-seed results as provisional; training-run variability remains unmeasured.
  TEST stays locked through model selection.
higher_resolution_justified: false
test_status: LOCKED / NOT USED
ready_to_train: false
prerequisites:
