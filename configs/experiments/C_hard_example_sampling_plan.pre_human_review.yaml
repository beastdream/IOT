success_safeguards: Use the same A framework validation procedure first; require target
  recall improvement and report all precision/AP deltas. Conservative descriptive
  non-degradation checks (delta >=0) for listed safeguards define a candidate, not
  significance. Any decrease prevents automatic usefulness/promotion and requires
  explicit trade-off review; no post-hoc tolerance tuning. Also require improved recovery
  of prior VALID hard cases at unchanged diagnostic settings without hiding regressions.
  Do not train from VALID identities.
evaluation_policy: No confidence tuning alongside C. Same framework evaluation as
  A, same VALID split. TEST locked. At most one primary C configuration, except technical
  invalidation.
