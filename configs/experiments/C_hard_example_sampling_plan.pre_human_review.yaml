primary_hypothesis: A small set of persistently hard TRAIN images may be under-exposed
  relative to easy images. Increasing their runtime exposure may improve robustness
  more efficiently than weighting every Without Helmet image. Hypothesis, not proven.
primary_change: TRAIN sampling exposure based solely on frozen-A TRAIN difficulty
